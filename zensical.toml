[project.theme]
language = "en"
custom_dir = "overrides"
# No external font requests. Fonts are self-hosted in docs/assets/fonts (see extra.css).
font = false
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/flask-conical"
repo = "fontawesome/brands/github"

# Calm blue, with light, dark and "follow my system" modes.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
# Menu group names, so the breadcrumb can skip them (they are headings, not pages).
# BEGIN nav groups (generated by scripts/build_nav.py, do not edit by hand)
nav_groups = []
# END nav groups

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/myopensdet/myopensdet.github.io"
name = "myOpenSDET on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/arshaduzzaman-sm/"
name = "Arshaduzzaman SM on LinkedIn"

[project.extra.status]
draft = "Coming soon"

# "Was this page helpful?" at the end of every finished page.
# provider = "goatcounter" is our own file (overrides/partials/integrations/
# analytics/goatcounter.html). Until Phase 9 it sends nothing anywhere.
[project.extra.analytics]
provider = "goatcounter"

[project.extra.analytics.feedback]
title = "Was this page helpful?"

[[project.extra.analytics.feedback.ratings]]
icon = "lucide/thumbs-up"
name = "Yes, this page helped me"
data = 1
note = "Thanks! Glad it helped. A star on <a href=\"https://github.com/myopensdet/myopensdet.github.io\" target=\"_blank\" rel=\"noopener\">GitHub</a> helps other testers find this site."

[[project.extra.analytics.feedback.ratings]]
icon = "lucide/thumbs-down"
name = "No, this page needs work"
data = 0
note = "Thanks for telling us. <a href=\"https://github.com/myopensdet/myopensdet.github.io/issues/new?template=content-error.yml&title=Content%3A%20{title}&page=https%3A%2F%2Fmyopensdet.github.io{url}\" target=\"_blank\" rel=\"noopener\">Tell us what was unclear</a> and we will fix it."

# Comments under each lesson (Giscus = GitHub Discussions). OFF until Phase 9:
# it needs a public repo. Fill repo_id and category_id from https://giscus.app.
[project.extra.giscus]
enabled = false
repo = "myopensdet/myopensdet.github.io"
repo_id = ""
category = "Lessons"
category_id = ""

[project.plugins.tags]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Code shown on the site is pulled from the real files in modules/ (brief, section 5, rule 3).
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
# Hover explanations for short forms (API, BDD...), built from data/glossary.yml.
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
