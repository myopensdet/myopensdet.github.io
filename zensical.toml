# myOpenSDET: site configuration for Zensical.
# Docs: https://zensical.org/docs/setup/basics/
# Preview locally:  .venv/bin/zensical serve   (then open http://127.0.0.1:8001/)
# Port 8001, so it never clashes with other projects on 8000. 127.0.0.1 = this computer only.
# The site URL lives only here, so moving to a custom domain later is one edit.

[project]
site_name = "myOpenSDET"
site_url = "https://myopensdet.github.io/"
site_description = "Everything you need to test software well, in one place. Learn software testing and test automation, step by step. Real templates and code you can use at work. Free."
site_author = "Arshaduzzaman SM"
copyright = "&copy; 2026 Arshaduzzaman SM. Code under MIT, text under CC BY 4.0."
docs_dir = "docs"
dev_addr = "127.0.0.1:8001"

repo_url = "https://github.com/myopensdet/myopensdet.github.io"
repo_name = "myopensdet/myopensdet.github.io"
edit_uri = "edit/main/docs/"

# Working files that live in docs/ but are not pages for readers.
exclude_docs = """
assets/images/IMAGES_NEEDED.md
"""
extra_css = ["assets/stylesheets/extra.css"]
# Progress tracker (saved only in the reader's browser) and share buttons. Neither sends anything.
extra_javascript = ["assets/javascripts/progress.js", "assets/javascripts/share.js"]

