# Publish the website to GitHub Pages on every push to main.
# Switched on 2026-11-19, when the repository went public (see CONTRIBUTING.md, "Publishing the website").
#
# Security choices:
# - Every action is pinned to a full commit SHA, not a tag, so a moved or
#   hijacked tag cannot change what runs. The tag is in the comment.
# - The token can only read the code, write to Pages, and prove its identity
#   to Pages (id-token). Nothing else.
# - The checkout does not keep the token on disk (persist-credentials: false).
# - Python packages are installed with --require-hashes, the same as locally.
# - No secrets are used. The build needs none.

name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. A newer push waits; a running publish is not cut off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the website tools (pinned, hash-checked)
        run: python -m pip install --require-hashes --no-deps -r requirements-docs.txt

      - name: Build the website (fails on any warning)
        run: zensical build --strict

      - name: Make the share images
        run: python scripts/build_share_images.py

      - name: Forward old addresses to moved pages
        run: python scripts/build_redirects.py

      - name: Add the security policy (CSP) to every page
        run: python scripts/build_csp.py

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
