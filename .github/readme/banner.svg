<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">myOpenSDET</title>
  <desc id="d">Everything you need to become a professional SDET. A terminal shows four passing tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143f80"/>
      <stop offset="1" stop-color="#1f5fbf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="72" y="168" font-size="76" font-weight="700" letter-spacing="-1">myOpenSDET</text>
    <text x="74" y="222" font-size="28" fill-opacity="0.92">Everything you need to become a professional SDET.</text>
    <text x="74" y="270" font-size="22" fill-opacity="0.75">Learn software testing and test automation, step by step.</text>
    <text x="74" y="302" font-size="22" fill-opacity="0.75">Hands-on with Python, real templates, free.</text>
  </g>
  <g transform="translate(860 92)">
    <rect width="348" height="216" rx="12" fill="#0d1b33" fill-opacity="0.92"/>
    <rect width="348" height="34" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff6b6b"/>
    <circle cx="38" cy="17" r="5.5" fill="#ffc857"/>
    <circle cx="56" cy="17" r="5.5" fill="#4cd282"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="20" y="64" fill="#9cc3fa">$ <tspan fill="#ffffff">pytest -v</tspan></text>
      <text x="20" y="92" fill="#c9d6ea">test_login.py <tspan fill="#4cd282">PASSED</tspan></text>
      <text x="20" y="116" fill="#c9d6ea">test_api.py <tspan fill="#4cd282">PASSED</tspan></text>
      <text x="20" y="140" fill="#c9d6ea">test_db.py <tspan fill="#4cd282">PASSED</tspan></text>
      <text x="20" y="164" fill="#c9d6ea">test_ui.py <tspan fill="#4cd282">PASSED</tspan></text>
      <text x="20" y="196" fill="#4cd282" font-weight="700">4 passed in 0.95s</text>
    </g>
  </g>
</svg>
