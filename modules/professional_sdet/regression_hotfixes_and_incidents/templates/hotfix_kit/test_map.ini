# Template from myOpenSDET: https://myopensdet.github.io/
# Which code belongs to which test area. CHANGE: your folders and your pytest markers.
# code   = file patterns (comma separated) for that area
# marker = the pytest marker that selects its tests

[settings]
# Always run these, whatever changed
always = smoke
# Files that never need tests (documentation and the like)
ignore = docs/*, *.md, .github/ISSUE_TEMPLATE/*

[checkout]
code = src/checkout/*, src/payments/*, tests/*checkout*
marker = checkout

[search]
code = src/search/*, tests/*search*
marker = search

[login]
code = src/auth/*, tests/*login*
marker = login

[shared]
# Code everything uses: a change here needs the full regression
code = src/common/*, src/db/*, requirements.txt, tests/conftest.py
marker = regression
