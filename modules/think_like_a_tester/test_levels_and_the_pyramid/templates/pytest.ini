# Template from myOpenSDET: https://myopensdet.github.io/
# Put this file in your project's main folder. It tells pytest where the tests
# are, and lists the test levels, so a typo like "-m unti" is an error, not silence.
[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unit: one function or class on its own, no database or network
    integration: several parts of the app working together
    api: real HTTP requests to the app's API
    ui: a real browser, driven like a user
    e2e: a whole user journey through the full system
