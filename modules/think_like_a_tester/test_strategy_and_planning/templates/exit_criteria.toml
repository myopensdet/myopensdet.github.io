# Template from myOpenSDET: https://myopensdet.github.io/
# Exit criteria: testing is done when every number is at or below its limit.
# Agree these numbers with your team before testing starts, not at the end.
[exit]
failed_tests = 0                 # automated tests failing on the release build
open_critical_bugs = 0
open_major_bugs = 0              # some teams allow a few, each with a written reason
requirements_without_tests = 0   # from the traceability report
deep_risks_not_tested = 0        # from the risk list
