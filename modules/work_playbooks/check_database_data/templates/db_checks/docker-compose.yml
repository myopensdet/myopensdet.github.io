# Template from myOpenSDET: https://myopensdet.github.io/
# A practice shop database, filled from sql/practice_shop.sql. Your own computer only.
#
#   cp .env.example .env              once, then change the password
#   docker compose up -d --wait       start it, and wait until it's ready
#   docker compose down -v            stop it and delete its data

name: zts-db-checks

services:
  db:
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_tester
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${DB_PORT:-58232}:5432"
    volumes:
      # Runs once, when the database is created.
      - ./sql/practice_shop.sql:/docker-entrypoint-initdb.d/practice_shop.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop_tester", "-d", "shop"]
      interval: 2s
      retries: 30
