# Template from myOpenSDET: https://arshaduzzaman-sm.github.io/myopensdet/
[pytest]
testpaths = tests
pythonpath = .
xfail_strict = true
# Every run writes three reports into reports/: one for people, one for tools, one log.
addopts = -ra --strict-markers
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
# Logs captured for each test: shown in the terminal and in the report when a test fails.
log_level = INFO
log_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_date_format = %H:%M:%S
# Every log line of the run, with the bodies (DEBUG), in one file.
log_file = reports/tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_file_date_format = %H:%M:%S
markers =
    smoke: the few tests to run first, on every change
