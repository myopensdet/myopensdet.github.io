# Template from myOpenSDET: https://myopensdet.github.io/
[pytest]
testpaths = tests
# The db package is in this folder.
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: the few checks that must pass before anything else
xfail_strict = true
# Show the client's "SQL ... | 2 values" lines when a test fails.
log_level = INFO
