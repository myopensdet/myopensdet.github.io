# Template from myOpenSDET: https://myopensdet.github.io/
[pytest]
testpaths = tests
# The api package is in this folder.
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: the few checks that must pass before anything else
xfail_strict = true
# Show the client's "GET url -> 200 in 120 ms" lines when a test fails.
log_level = INFO
