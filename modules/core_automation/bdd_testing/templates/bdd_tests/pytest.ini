# Template from myOpenSDET: https://arshaduzzaman-sm.github.io/myopensdet/
[pytest]
testpaths = tests
pythonpath = .
bdd_features_base_dir = features
addopts = -ra --strict-markers
xfail_strict = true
markers =
    smoke: the few scenarios to run first, on every change
    known_bug: fails because of a known bug (turned into a strict xfail in conftest.py)
