# Template from myOpenSDET: https://arshaduzzaman-sm.github.io/myopensdet/
[pytest]
# Where the tests are, and where the code under test is.
testpaths = tests
pythonpath = src

# -ra: list every test that didn't pass at the end, with the reason.
# --strict-markers: a misspelled marker is an error, not a silent new marker.
# -m "not api": tests that need a server run only when you ask (-m api).
addopts = -ra --strict-markers -m "not api"

markers =
    smoke: a few quick checks of the most important things, run on every push
    nightly: long checks, run once a night
    api: needs a running server (run with -m api)

# A test marked xfail that starts passing fails the run, so nobody forgets it.
xfail_strict = true
