# Template from myOpenSDET: https://myopensdet.github.io/
# Three test databases for your own computer: PostgreSQL, MySQL and MongoDB.
# SQLite needs no server: it is a file, made by the tests.
#
#   cp config/.env.example .env     once, then change the passwords
#   docker compose up -d --wait     start, and wait until all three are ready
#   docker compose down -v          stop and delete all their data
#
# Every port listens on 127.0.0.1 only, so other computers can't reach them.
# Images are pinned to an exact version and digest, so they never change by surprise.

name: multi-db-tests

services:
  postgres:
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_tester
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy config/.env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop_tester", "-d", "shop"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop_tester
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy config/.env.example to .env first}
      # Nobody needs the root account for tests, so it gets a random password nobody knows.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      retries: 60

  mongo:
    image: mongo:8.0.38@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    environment:
      MONGO_INITDB_ROOT_USERNAME: shop_tester
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Copy config/.env.example to .env first}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 30
