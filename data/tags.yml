# The only tags a page may use. One list keeps tags tidy at any size:
# no "api" next to "API testing" next to "APIs".
#
# Add a tag here first, then use it in a page's front matter:
#   tags:
#     - API
# Each page has 1 to 3 tags. Run: .venv/bin/python scripts/build_reference.py
#
# name: what readers see.  about: one plain sentence for the Tags page.

